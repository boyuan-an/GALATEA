[metadata]
name = galatea_recon
version = 0.1.0
description = GALATEA hand-object interaction reconstruction
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = find:
python_requires = >=3.10
install_requires =
    numpy
    scipy
    opencv-python
    Pillow
    imageio
    matplotlib
    trimesh
    open3d
    pyrender
    pyyaml
    tqdm
    torch
    torchvision
    transformers

[options.extras_require]
dev =
    pytest

[options.packages.find]
include =
    galatea_recon
    galatea_recon.*
    baselines
    baselines.*

[options.package_data]
baselines =
    sources.json
    README.md
    requirements.txt
    */README.md
    */UPSTREAM_LICENSE
    configs/*.json
    */patches/*.patch
